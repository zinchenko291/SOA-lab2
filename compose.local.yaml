services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: space_marine
      POSTGRES_USER: root
      POSTGRES_PASSWORD: local-development
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d space_marine"]
      interval: 2s
      timeout: 3s
      retries: 30
  mule-esb:
    build:
      context: ./mule-esb
    environment:
      COLLECTION_REQUEST_CONFIG: collectionHttp
      COLLECTION_HOST: host.docker.internal
      STARSHIP_SOAP_REQUEST_CONFIG: starshipSoapHttp
      STARSHIP_SOAP_HOST: host.docker.internal
      UPSTREAM_TRUSTSTORE: /opt/java/openjdk/lib/security/cacerts
      UPSTREAM_TRUSTSTORE_TYPE: JKS
    ports:
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:8084:8084"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "2", "-o", "/dev/null", "http://127.0.0.1:8083/openapi.yaml"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 45s
volumes:
  local_postgres_data:
